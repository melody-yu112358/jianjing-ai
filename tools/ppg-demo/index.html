<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>渐静 · 手机心率短测工具</title>
<style>body{font:16px/1.7 system-ui,sans-serif;background:#102027;color:#edf4f4;margin:0;padding:24px}main{max-width:640px;margin:auto}button{font:inherit;padding:12px 18px;margin:6px 6px 6px 0;border:0;border-radius:8px;background:#afe2d4;color:#102027}button:disabled{opacity:.4}#stop{background:#ffd6bd}video{width:128px;height:128px;object-fit:cover;border-radius:12px}progress{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#c0ced0}#status{min-height:3em}a{color:#afe2d4}</style></head>
<body><main><h1>手机心率短测</h1>
<p>独立采集工具 · 每次约 25 秒。手指轻盖后置镜头与闪光灯，保持不动，不要用力按压。发热或不适时立即停止。</p>
<p><small>需要支持摄像头和闪光灯控制的手机浏览器，以及可信 HTTPS。同一设备、姿势和光线下完成前后测；本工具不是医疗设备，不判断入睡或疗效。</small></p>
<button id="reset">新会话 / 清空记录</button><button id="pre">开始前测</button><button id="post">开始后测</button><button id="stop" disabled>停止采集</button>
<p id="status" role="status" aria-live="polite">先启动 mixed 模式。前测完成后再连接正式视觉页面；后测请在仪式结束前预留约 25 秒。</p>
<video id="camera" autoplay muted playsinline aria-label="摄像头预览"></video><canvas id="roi" width="32" height="32" hidden></canvas>
<progress id="progress" max="25" value="0" aria-label="测量进度"></progress>
<p id="result"></p><button id="summary">刷新会话记录</button><pre id="details"></pre>
<p><small>摄像头图像只在本机处理。提交的仅为 ROI 颜色均值时间序列，后端估算心率后立即丢弃序列，不保存视频。采集期间请保持页面在前台。质量不足时不会更新心率。</small></p>
<script type="module" src="./app.js"></script></main></body></html>
